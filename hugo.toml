baseURL = 'https://liousihjia.github.io/'
languageCode = 'zh-tw'
title = 'JiaJia | 個人實驗室'
theme = 'PaperMod'

[[menu.main]]
name = "文章"
url = "/posts/"
weight = 10

[params]
  env = 'production'
  description = '個人實驗筆記｜後端、搜尋與機器學習相關'
  author = 'JiaJia'

  # 開啟個人首頁模式
  [params.profileMode]
    enabled = true
    title = "嗨 👋 我是 JiaJia"
    subtitle = "在這裡隨手整理後端、搜尋與機器學習相關的實作與心得。\n\n內容偏個人實驗與筆記，不代表任何雇主或機構立場。"
    
    # 之後可以換成您的大頭貼圖片路徑 (例如放到 static/avatar.png)
    imageUrl = "" 
    imageWidth = 120
    imageHeight = 120

    # profile 模式下首頁不列出文章，用按鈕連到文章列表
    [[params.profileMode.buttons]]
    name = "技術文章"
    url = "/posts/"

  # 社交連結設定
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/liousihjia"
